# One entry per data source.
# Fields marked "TO VALIDATE" must be confirmed with real queries in Workshop #1.

scope:
  name: Colombia
  bbox: {min_lat: -4.3, max_lat: 13.5, min_lon: -79.1, max_lon: -66.8}

sources:
  - id: nasa_glc
    name: NASA Global Landslide Catalog (COOLR)
    role: historical
    owner: NASA Goddard Space Flight Center
    url: https://gpm.nasa.gov/landslides/data.html   # TO VALIDATE: exact download URL
    format: csv
    auth: none
    schedule: once            # static inventory, re-checked occasionally
    watermark_field: null     # full reload; detect changes by content hash
    duplicate_key: event_id
    license: Public domain (NASA data)  # TO VALIDATE
    attribution: >-
      Kirschbaum, D.B., Adler, R., Hong, Y., Hill, S., Lerner-Lam, A. (2010).
      A global landslide catalog for hazard applications. Natural Hazards.
      Kirschbaum, D.B., Stanley, T., Zhou, Y. (2015). Spatial and temporal
      analysis of a global landslide catalog. Geomorphology.

  - id: openmeteo_historical
    name: Open-Meteo Historical Weather API (ERA5 reanalysis)
    role: historical
    owner: Open-Meteo
    url: https://archive-api.open-meteo.com/v1/archive
    format: json
    auth: none
    rate_limit: ~10,000 calls/day, non-commercial use
    schedule: once
    partitioning: by grid point and year
    watermark_field: date     # daily values
    duplicate_key: [latitude, longitude, date]
    license: CC BY 4.0
    attribution: Weather data by Open-Meteo.com (CC BY 4.0), ERA5 by Copernicus/ECMWF

  - id: openmeteo_forecast
    name: Open-Meteo Forecast API
    role: incremental
    owner: Open-Meteo
    url: https://api.open-meteo.com/v1/forecast
    format: json
    auth: none
    rate_limit: ~10,000 calls/day, non-commercial use
    schedule: hourly          # TO VALIDATE
    watermark_field: time     # last observed hourly timestamp (UTC)
    overlap_window: past_days=2   # recent values can be revised
    duplicate_key: [latitude, longitude, time]
    license: CC BY 4.0
    attribution: Weather data by Open-Meteo.com (CC BY 4.0)

  - id: nasa_lhasa
    name: NASA LHASA global landslide nowcast
    role: incremental
    owner: NASA Goddard Space Flight Center
    url: https://maps.nccs.nasa.gov/download/landslides/nowcast/
    format: geotiff
    auth: none
    schedule: daily
    watermark_field: file_date   # date in file name; also Last-Modified header  # TO VALIDATE
    duplicate_key: [file_date, cell]
    availability: best effort (may skip days)
    license: Public domain (NASA data)  # TO VALIDATE
    attribution: >-
      Kirschbaum, D., Stanley, T. (2018). Satellite-based assessment of
      rainfall-triggered landslide hazard for situational awareness. Earth's Future.
